# On every pull request: lint, the tests (against Python seekpath, run by
# tests/seekpath.test.js in its uv environment) and the build.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The test reference (tests/reference) is a uv project; uv fetches
      # the Python it needs
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tests/reference/uv.lock

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
